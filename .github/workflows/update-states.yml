name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # White bg, #1DD100 title, Blue text (#3178C6), Blue icons
          options: "username=${{ github.repository_owner }}&show_icons=true&bg_color=ffffff&title_color=1DD100&text_color=3178C6&icon_color=3178C6&border_color=e4e2e2"
          path: profile/stats-v5.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # Compact layout (progress bars), White bg, #1DD100 title, Blue text
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=4&bg_color=ffffff&title_color=1DD100&text_color=3178C6&border_color=e4e2e2"
          path: profile/top-langs-v5.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
