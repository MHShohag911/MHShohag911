name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. Download the Stats card
      - name: Download Stats Card
        run: |
          mkdir -p profile
          curl -s "https://github-readme-stats.vercel.app/api?username=MHShohag911&show_icons=true&bg_color=ffffff&title_color=1DD100&text_color=3178C6&icon_color=3178C6&border_color=e4e2e2" -o profile/stats-v8.svg

      # 2. Download the Languages card (Forcing compact layout)
      - name: Download Top Languages Card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=MHShohag911&layout=compact&langs_count=4&bg_color=ffffff&text_color=333333&border_color=e4e2e2" -o profile/top-langs-v8.svg
          
      # 3. Force the Title color to #1DD100 directly in the SVG file
      - name: Inject #1DD100 Title Color
        run: |
          sed -i 's/fill="[^"]*"/fill="#1DD100"/' profile/top-langs-v8.svg

      # 4. Commit the new files
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
